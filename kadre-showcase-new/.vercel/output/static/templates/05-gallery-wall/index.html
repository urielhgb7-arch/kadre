    <style>
        /* Desactiver le scroll classique sur le HTML, c'est le proxy qui dicte le scroll */
        body { overflow-x: hidden; }
        .gallery-3d-scroll-proxy { position: absolute; top: 0; left: 0; z-index: 1; }
        
        .gallery-3d-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            perspective: 1200px;
            overflow: hidden;
            z-index: 5; /* behind navbar */
            background: transparent;
        }
        
        .gallery-3d-world {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .tableau {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; max-width: 800px; max-height: 80vh; overflow-y: auto;
            background: rgba(32, 29, 26, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 60px 40px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 40px 80px rgba(0,0,0,0.4), inset 0 0 60px rgba(255,255,255,0.02);
            border-radius: 4px;
            -webkit-font-smoothing: antialiased;
            backface-visibility: hidden;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        [data-theme-mode="dark"] .tableau {
            background: rgba(9, 9, 11, 0.55);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 60px rgba(255,255,255,0.02);
        }
        [data-theme-mode="light"] .tableau {
            background: rgba(253, 251, 247, 0.55);
            border: 1px solid rgba(0,0,0,0.08);
            color: var(--text-primary);
            text-shadow: none;
        }
        
        /* The staggering in Z space and slightly in X/Y */
        .tableau-1 { transform: translate(-50%, -50%) translateZ(0px); z-index: 4; }
        .tableau-2 { transform: translate(-50%, -50%) translateZ(-1500px); z-index: 3; }
        .tableau-3 { transform: translate(-50%, -50%) translateZ(-3000px); z-index: 2; }
        .tableau-1-clone { transform: translate(-50%, -50%) translateZ(-4500px); z-index: 1; }
        
        /* Hide the footer on the 3D view to avoid layout mess */
        footer { display: none !important; }
        
        /* Smooth fade ins */
        .tableau * { opacity: 1 !important; /* transform: none !important; */ animation: none !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js?v=2.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js?v=2.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js?v=2.1"></script>
    <script src="js/anim.js?v=2.1"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const world = document.getElementById('gallery-world');
            if(!world) return;
            
            if(typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                // Clone the first tableau for the loop
                const firstTableau = document.querySelector('.tableau-1');
                if (firstTableau) {
                    const clone = firstTableau.cloneNode(true);
                    clone.classList.remove('tableau-1');
                    clone.classList.add('tableau-1-clone');
                    world.appendChild(clone);
                }

                gsap.registerPlugin(ScrollTrigger);
                
                gsap.to(world, {
                    z: 4500, // Move an extra 500 to reach the clone
                    ease: "none",
                    scrollTrigger: {
                        trigger: ".gallery-3d-scroll-proxy",
                        start: "top top",
                        end: "bottom bottom",
                        scrub: 1,
                        onUpdate: (self) => {
                            // Seamless loop
                            if (self.progress === 1) {
                                // Jump back to start
                                window.scrollTo(0, 1);
                            }
                        }
                    }
                });
                
                gsap.utils.toArray('.tableau').forEach((tab, i) => {
                    // Frame 1 is at 0, Frame 2 at -1500, Frame 3 at -3000, Clone at -4500
                    // World moves 4500 total.
                    const startScroll = i * (100 / 4); // 25% per frame
                    const endScroll = startScroll + 15;
                    
                    gsap.to(tab, {
                        opacity: 0,
                        ease: "power2.in",
                        scrollTrigger: {
                            trigger: ".gallery-3d-scroll-proxy",
                            start: `${startScroll}% top`,
                            end: `${endScroll}% top`,
                            scrub: true
                        }
                    });
                    
                    // Add a subtle scale up to push them out of screen smoothly
                    gsap.to(tab, {
                        scale: 1.5,
                        ease: "power1.in",
                        scrollTrigger: {
                            trigger: ".gallery-3d-scroll-proxy",
                            start: `${startScroll}% top`,
                            end: `${endScroll + 10}% top`,
                            scrub: true
                        }
                    });
                });
            } else {
                window.addEventListener('scroll', () => {
                    const scrolled = window.scrollY;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    if(maxScroll > 0) {
                        const progress = scrolled / maxScroll;
                        const z = progress * 4000;
                        world.style.transform = `translateZ(${z}px)`;
                    }
                });
            }
        
        });
    </script>
