<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#80F2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fond noir absolu profond -->
  <rect width="512" height="512" rx="112" fill="#060608" />
  
  <!-- "Kadre" : Le cadre extérieur, lumineux et élégant -->
  <rect x="120" y="120" width="272" height="272" rx="56" fill="none" stroke="url(#grad)" stroke-width="24" filter="url(#glow)" />
  
  <!-- "Aura" : Le point focal central -->
  <circle cx="256" cy="256" r="48" fill="url(#grad)" filter="url(#glow-strong)" />
</svg>
