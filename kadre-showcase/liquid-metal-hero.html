<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Metal Hero — KADRE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --fg: #f8f8f2;
            --fg-dim: rgba(248,248,242,0.7);
            --accent: #d4a656;
            --radius: 12px;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--fg);
            background: #060608;
            overflow-x: hidden;
        }

        /* ── Liquid Metal Canvas ─────────────────────────────────────── */
        #liquid-metal-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* ── Hero Section ────────────────────────────────────────────── */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .hero-inner {
            text-align: center;
            max-width: 900px;
            padding: 0 24px;
        }

        /* ── Badge ───────────────────────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            background: rgba(248,248,242,0.08);
            border: 1px solid rgba(248,248,242,0.15);
            color: var(--fg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s 0.2s ease forwards;
        }

        /* ── Title ───────────────────────────────────────────────────── */
        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s 0.4s ease forwards;
        }

        /* ── Subtitle ────────────────────────────────────────────────── */
        .hero-subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            color: var(--fg-dim);
            line-height: 1.7;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s 0.6s ease forwards;
        }

        /* ── CTA Buttons ─────────────────────────────────────────────── */
        .hero-cta {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s 0.8s ease forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 36px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: var(--fg);
            color: #0a0a0a;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }

        .btn-outline {
            background: transparent;
            color: var(--fg);
            border: 1px solid rgba(248,248,242,0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-outline:hover {
            background: rgba(248,248,242,0.08);
            border-color: rgba(248,248,242,0.45);
            transform: translateY(-3px) scale(1.03);
        }

        .btn:active { transform: translateY(0) scale(0.97); }

        /* ── Features Card ───────────────────────────────────────────── */
        .features-card {
            background: rgba(248,248,242,0.06);
            border: 1px solid rgba(248,248,242,0.12);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            padding: 32px 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s 1s ease forwards;
            transition: transform 0.3s ease;
        }
        .features-card:hover { transform: translateY(-4px); }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .feature-item {
            text-align: center;
            padding: 8px;
            opacity: 0;
            transform: translateX(-20px);
            animation: fadeRight 0.6s 1.2s ease forwards;
        }
        .feature-item:nth-child(2) { animation-delay: 1.3s; }
        .feature-item:nth-child(3) { animation-delay: 1.4s; }

        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(212,166,86,0.12);
            border: 1px solid rgba(212,166,86,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: var(--accent);
        }

        .feature-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--fg);
        }

        /* ── Animations ──────────────────────────────────────────────── */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeRight {
            to { opacity: 1; transform: translateX(0); }
        }

        /* ── Responsive ──────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .features-grid { grid-template-columns: 1fr; gap: 20px; }
            .hero-cta { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 300px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<!-- Liquid Metal Background -->
<canvas id="liquid-metal-canvas"></canvas>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-inner">
        <!-- Badge -->
        <div class="badge">
            <span>&#10024;</span> Next Generation UI
        </div>

        <!-- Title -->
        <h1 class="hero-title">
            Fluid Design<br>Excellence
        </h1>

        <!-- Subtitle -->
        <p class="hero-subtitle">
            Experience the future of web interfaces with liquid metal aesthetics
            that adapt, flow, and captivate. Built for modern applications that
            demand both beauty and performance.
        </p>

        <!-- CTA Buttons -->
        <div class="hero-cta">
            <button class="btn btn-primary" onclick="alert('Primary CTA clicked!')">
                Start Building
            </button>
            <button class="btn btn-outline" onclick="alert('Secondary CTA clicked!')">
                View Examples
            </button>
        </div>

        <!-- Features Card -->
        <div class="features-card">
            <div class="features-grid">
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <p class="feature-label">Seamless Animations</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </div>
                    <p class="feature-label">Responsive Excellence</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                    </div>
                    <p class="feature-label">Modern Architecture</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Three.js -->
<script src="assets/js/three.min.js"></script>
<!-- Liquid Metal Shader -->
<script src="assets/js/liquid-metal-hero.js"></script>

</body>
</html>
