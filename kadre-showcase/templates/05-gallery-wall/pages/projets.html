                    localStorage.setItem('kadre_theme_mode', urlTheme);

                if(m === 'system') {
                    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.setAttribute('data-theme-mode', 'dark');
                    } else {
                        document.documentElement.setAttribute('data-theme-mode', 'light');

                    document.documentElement.setAttribute('data-theme-mode', m);

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var track = document.getElementById('marquee-track');
        if (!track) return;
        var mode = localStorage.getItem('kadre_marquee_mode_v1') || 'mixed';
        
        var galleryImages = [];
        try { var gRaw = localStorage.getItem('kadre_gallery_images_v1'); if (gRaw) { var gArr = JSON.parse(gRaw); if (gArr && gArr.length > 0) galleryImages = gArr.map(function(g) { return { type: 'image', title: g.title, url: g.url }; }); } } catch(e) {}
        if (galleryImages.length === 0) galleryImages = [{ type: 'image', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop' }, { type: 'image', url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=600&auto=format&fit=crop' }, { type: 'image', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop' }, { type: 'image', url: 'https://images.unsplash.com/photo-1487958449943-2429e8be8625?q=80&w=600&auto=format&fit=crop' }];

        var projectItems = [];
        try { var saved = localStorage.getItem('portfolio_data_v4'); if (saved) { var parsed = JSON.parse(saved); if (parsed.projects) projectItems = parsed.projects.map(function(p) { return { type: 'project', title: p.title, desc: p.description, url: p.image_url }; }); } } catch(e) {}
        
        var items = [];
        if (mode === 'images') items = galleryImages;
        else if (mode === 'projects') items = projectItems.length > 0 ? projectItems : galleryImages;
        else {
            var mx = Math.max(galleryImages.length, projectItems.length);
            for(var i=0; i<mx; i++) { if(i < galleryImages.length) items.push(galleryImages[i]); if(i < projectItems.length) items.push(projectItems[i]); }
        }
        
        var display = items.concat(items).concat(items);
        track.innerHTML = display.map(function(item) {
            var safeUrl = item.url || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop';
            if (item.type === 'project') {
                return '<div class="marquee-project-card"><img src="' + safeUrl + '"><div class="marquee-project-card-body"><h4>' + (item.title || 'Projet') + '</h4><p>' + (item.desc || '') + '</p></div></div>';
            } else {
                return '<div class="marquee-item"><img src="' + safeUrl + '"></div>';
            }
        }).join('');
    });
    </script>
